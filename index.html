<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a150d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Lily's Grilled Skewers — an arcade island-kitchen rush. Four steaks on the grill, four lobsters in the pot, and a hungry family on the clock."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a150d'/%3E%3Cpath d='M16 26c-5 0-8-3-8-7 0-5 4-6 4-11 3 2 3 4 2 6 2 0 3-2 3-5 4 3 5 6 5 10 0 4-3 7-6 7z' fill='%23ff7a18'/%3E%3Cpath d='M16 24c-2.4 0-4-1.5-4-3.5 0-2.4 2-3 2-5.5 2 1.6 4 3 4 6 0 1.7-.9 3-2 3z' fill='%23ffe066'/%3E%3C/svg%3E"
    />
    <title>Lily's Grilled Skewers</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2a150d;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        /* never swallow a tap, even if its removal timer is delayed */
        pointer-events: none;
        display: grid;
        place-items: center;
        background: #2a150d;
        color: #ffd8a8;
        font: 600 18px/1.5 ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.04em;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">warming up the grill…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
